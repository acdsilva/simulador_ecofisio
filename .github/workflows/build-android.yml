name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O build na nuvem da Expo (EAS) exige o segredo EXPO_TOKEN.
      # Crie em https://expo.dev/accounts/[conta]/settings/access-tokens
      # e adicione em Settings > Secrets and variables > Actions.
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Segredo EXPO_TOKEN não configurado — necessário para o EAS Build."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Android APK
        working-directory: frontend
        run: eas build --platform android --profile preview --non-interactive --no-wait
